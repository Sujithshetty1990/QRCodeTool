name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          show_full_output: true
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            This PR may have been reviewed by you on a previous commit. Do not skip or shorten this
            review for being "already reviewed," "trivial," or "already commented on" — always perform
            a full, fresh review of the complete current diff between the base branch and the latest
            commit, and report every issue you find in that diff.

            When gathering the diff or file contents, run one simple Bash command at a time — never
            chain multiple operations together with ; or && or pipes, since compound commands cannot
            be approved in this non-interactive environment. Never write files outside the checked-out
            repository's working directory (e.g. never write to /tmp) — if you need to inspect output,
            read it directly from the command result instead of redirecting it to a file.

            After the review completes, also post one top-level PR comment (in addition to
            any inline findings) with a short 2-4 sentence plain-language summary of what
            this PR changes, based on the diff, followed by the review outcome (issues found
            or none).
            
          claude_args: |
            --max-turns 30
            --model claude-sonnet-5
