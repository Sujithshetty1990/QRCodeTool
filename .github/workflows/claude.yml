name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            After the review completes, also post one top-level PR comment (in addition to
            any inline findings) with a short 2-4 sentence plain-language summary of what
            this PR changes, based on the diff, followed by the review outcome (issues found
            or none).

            If you find issues but are unable to post an inline comment for any reason, post a
            top-level PR comment instead with the finding and the reason the inline comment failed.
            
          claude_args: |
            --max-turns 30
            --model claude-sonnet-5
