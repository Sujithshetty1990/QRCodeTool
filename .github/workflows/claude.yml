name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            Repo: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            Head SHA: ${{ github.event.pull_request.head.sha }}

            Step 1 - Reconcile prior feedback (skip quietly if there are none):
            - Run `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
              and find comments you previously posted (identified by the
              `<!-- claude-code-review -->` marker you always include, see Step 3).
            - For each one whose issue is now fixed by commits since it was posted
              (check against `gh pr diff ${{ github.event.pull_request.number }}`), reply on
              that exact thread only - do not open a new comment, do not resolve/close it:
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/<comment_id>/replies -f body="<!-- claude-code-review --> Resolved as of ${{ github.event.pull_request.head.sha }} - looks fixed on re-review."`
            - Leave still-open, unfixed threads untouched. Never duplicate a comment for an
              issue you already flagged and that is still unfixed.

            Step 2 - Full review, no exceptions:
            Run `/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment`.
            Override the skill's own Step 1 gate entirely for this run - do NOT skip the
            review for being "trivial", "obviously correct", "already commented on", or any
            similar judgment call. Always perform the full analysis on the diff for this
            head SHA. When you do post an inline comment, prefix its body with the literal
            marker `<!-- claude-code-review -->` on its own line so future runs (Step 1) and
            you (right now, Step 3) can identify it.

            Step 3 - Guaranteed visible output (mandatory, no exceptions):
            After Step 2 finishes, confirm something was actually posted for this run (a new
            inline comment, or a "no issues found" summary comment). If nothing was posted -
            for ANY reason, including your own decision that no review was needed - you must
            still run:
              `gh pr comment ${{ github.event.pull_request.number }} --body "<!-- claude-code-review --> Reviewed <N> changed file(s) at ${{ github.event.pull_request.head.sha }}. No high-signal issues found."`
            A run that produces zero visible trace on the PR is a failure of this task. Also
            write a one-paragraph summary of what you reviewed and decided to
            `$GITHUB_STEP_SUMMARY` so it's visible on the workflow run page without digging
            through logs.
          claude_args: |
            --max-turns 60
