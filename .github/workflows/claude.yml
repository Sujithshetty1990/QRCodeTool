name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(gh pr *)"
                ]
              }
            }
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            This PR may have been reviewed by you on a previous commit. Do not skip or shorten this
            review for being "already reviewed," "trivial," or "already commented on" — always perform
            a full, fresh review of the complete current diff between the base branch and the latest
            commit, and report every issue you find in that diff.

            Step 1 - Get the diff:
            Run exactly one Bash command: `gh pr diff ${{ github.event.pull_request.number }}`.
            Do not chain this with any other command using ; or && or pipes, and do not redirect its
            output to a file (e.g. never write to /tmp) - read the command's output directly.

            Step 2 - Review the diff for:
            - Correctness bugs: logic errors, off-by-one mistakes, null reference risks, exception
              handling inconsistent with surrounding code.
            - Reuse/simplification/efficiency issues: duplicated code that should use an existing
              helper, unnecessary complexity, obvious performance problems (N+1 queries, unneeded
              allocations in loops).
            - Core/non-Core sync (per this repo's conventions in CLAUDE.md and
              .claude/knowledge/core-noncore-sync.md): any changes done must exist identically in both
              the Core and non-Core mirror. Flag as CRITICAL if one side has changes the other lacks.
            - Comment integrity: flag as CRITICAL any modification to an existing comment (regardless
              of language - many are in Danish). New comments on new code are fine.
            - Encoding corruption: check changed files for the Unicode replacement character (U+FFFD)
              in string literals or comments - this has previously destroyed Icelandic letters in
              author names during Windows-1252 to UTF-8 re-encodes (see
              .claude/knowledge/encoding-corruption.md).

            Step 3 - Post your findings:
            Post a single top-level PR comment (do not attempt inline/per-line review comments) with
            one Bash command: `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.
            Do not chain this with any other command. Format the body as a list of findings using
            "File:Line - description" for each issue, grouped by severity (CRITICAL / WARNING /
            SUGGESTION). If no issues are found, post a comment stating that clearly instead.

          claude_args: |
            --max-turns 40
            --model claude-sonnet-5
