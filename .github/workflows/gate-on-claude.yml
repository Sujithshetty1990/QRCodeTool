name: Gate on Claude Review

on:
  check_run:
    types: [completed]

jobs:
  gate:
    if: github.event.check_run.name == 'Claude Code Review'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Fail if Claude reported Important findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_RUN_ID: ${{ github.event.check_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          COUNTS=$(gh api "repos/${REPO}/check-runs/${CHECK_RUN_ID}" \
            --jq '.output.text | split("bughunter-severity: ")[1] | split(" -->")[0] | fromjson' \
            || echo '{}')

          echo "Severity counts: ${COUNTS}"

          NORMAL=$(echo "${COUNTS}" | jq -r '.normal // 0')

          if [ "${NORMAL}" -gt 0 ]; then
            echo "::error::Claude flagged ${NORMAL} Important finding(s). Merge blocked until resolved."
            exit 1
          fi

          echo "No Important findings. Merge allowed."
